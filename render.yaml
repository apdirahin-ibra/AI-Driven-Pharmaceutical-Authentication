services:
  - type: web
    name: pharmaguard-ai-api
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_PATH
        value: models/cnn_best_model.keras
      - key: MODEL_CLASS_NAMES
        value: Fake,Real
      - key: SUSPICIOUS_THRESHOLD
        value: "0.75"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: IMAGE_VALIDATOR_BASE_URL
        value: https://router.requesty.ai/v1
      - key: IMAGE_VALIDATOR_MODEL
        value: openai/gpt-4o
      - key: IMAGE_VALIDATOR_TIMEOUT_SECONDS
        value: "30"
      - key: FRONTEND_ORIGINS
        sync: false
      - key: IMAGE_VALIDATOR_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
